name: Build Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# 允许工作流创建 Release / 上传产物
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  NDK_VERSION: "25.2.9519653"
  # rquickjs(bindgen) 在宿主 Ubuntu 上生成 aarch64-android 绑定时，宿主 clang 找不到
  # multiarch 头文件 /usr/include/bits/libc-header-start.h，需显式指定宿主目标与 multiarch include 路径
  BINDGEN_EXTRA_CLANG_ARGS: "--target=x86_64-linux-gnu -I/usr/include/x86_64-linux-gnu"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-android-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-android-

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 手动安装 Android SDK：android-actions/setup-android@v3 已失效（会装 preview cmdline-tools
      # 并尝试安装已废弃的 tools 包，导致 sdkmanager 退出码 1）。
      - name: Setup Android SDK (cmdline-tools)
        run: |
          ANDROID_HOME=$HOME/android-sdk
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -sSL --retry 5 -o cmdtools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q -o cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      # 本步才调用 sdkmanager（上一步写入的 $GITHUB_PATH 已对后续步骤生效）
      - name: Install Android build deps
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1
          sdkmanager --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;${{ env.NDK_VERSION }}"
          echo "Installed NDK under: $ANDROID_HOME/ndk"

      # rquickjs(bindgen) 在编译期用 libclang 生成 QuickJS 的 aarch64-android 绑定
      - name: Install host clang (rquickjs bindgen)
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Init Android project
        run: pnpm tauri android init
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}

      # 先出 debug 包（自带签名、可直装）；跳过 R8 压缩，规避 release 的 minifyUniversalReleaseWithR8 任务报错
      - name: Build APK (aarch64, debug)
        run: pnpm tauri android build --target aarch64 --debug
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Locate APK
        id: apk
        run: |
          APK=$(find src-tauri/gen/android -name "*.apk" | head -1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: muhai-android-aarch64-debug
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      # 打 tag（如 v4.1.2）推送时，自动创建 GitHub Release 并附上 APK
      - name: Publish to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
