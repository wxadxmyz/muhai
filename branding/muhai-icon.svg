<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#243157"/>
      <stop offset="0.55" stop-color="#121a33"/>
      <stop offset="1" stop-color="#080b14"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.38" cy="0.26" r="0.78">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringA" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2d55"/>
      <stop offset="1" stop-color="#ff9a3d"/>
    </linearGradient>
    <linearGradient id="ringB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#38e1d0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="0.34" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="squircle"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#glow)"/>

    <!-- Link：两枚相扣的链环（整体旋转 -42°） -->
    <g transform="rotate(-42 256 256)">
      <rect x="56"  y="180" width="236" height="152" rx="76" fill="none"
            stroke="url(#ringA)" stroke-width="40"/>
      <rect x="220" y="180" width="236" height="152" rx="76" fill="none"
            stroke="#0c1120" stroke-width="56"/>
      <rect x="220" y="180" width="236" height="152" rx="76" fill="none"
            stroke="url(#ringB)" stroke-width="40"/>
    </g>

    <!-- TV：中央白色圆角播放三角 -->
    <path d="M234 206 L234 306 L316 256 Z" fill="#ffffff" stroke="#ffffff"
          stroke-width="16" stroke-linejoin="round"/>

    <rect width="512" height="512" fill="url(#shine)"/>
  </g>

  <rect x="3" y="3" width="506" height="506" rx="109" fill="none"
        stroke="#ffffff" stroke-opacity="0.10" stroke-width="4"/>
</svg>
