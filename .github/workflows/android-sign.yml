name: Sign Android APK (existing unsigned release asset)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag that contains the unsigned APK'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  sign:
    runs-on: ubuntu-22.04
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build-tools (provides apksigner)
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}
          yes | sdkmanager --licenses || true
          sdkmanager "build-tools;34.0.0"

      - name: Download unsigned APK from release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/apk
          gh release download "${{ inputs.tag }}" -R ${{ github.repository }} -p "app-universal-release-unsigned.apk" -D /tmp/apk

      - name: Decode keystore from secret
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/keystore.p12
          echo "storepass=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "alias=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "keypass=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Sign APK (v1 + v2 + v3)
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}
          SRC=/tmp/apk/app-universal-release-unsigned.apk
          OUT=/tmp/${{ github.event.repository.name }}-android.apk
          APKSIGNER=$ANDROID_HOME/build-tools/34.0.0/apksigner
          $APKSIGNER sign \
            --ks /tmp/keystore.p12 \
            --ks-key-alias "$alias" \
            --ks-pass pass:"$storepass" \
            --key-pass pass:"$keypass" \
            --out "$OUT" \
            "$SRC"
          $APKSIGNER verify --verbose "$OUT"
          SHA=$(sha256sum "$OUT" | awk '{print $1}')
          echo "signed=$OUT" >> "$GITHUB_ENV"
          echo "APK_SHA256=$SHA" >> "$GITHUB_ENV"
          echo "APK_SHA256=$SHA"

      - name: Replace asset in Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ inputs.tag }}" "$signed" --clobber
          ASSET_ID=$(gh api "repos/${{ github.repository }}/releases/tags/${{ inputs.tag }}" \
            --jq '.assets[] | select(.name=="app-universal-release-unsigned.apk") | .id')
          if [ -n "$ASSET_ID" ]; then
            gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$ASSET_ID"
          fi
          echo "Replaced unsigned APK with signed ${{ github.event.repository.name }}-android.apk"
          echo "Final SHA256: $APK_SHA256"
