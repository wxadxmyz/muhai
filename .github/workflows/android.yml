on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag to upload the APK to'
        required: true
        default: 'v1.0.1'

name: Android Build

jobs:
  build-android:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      issues: write
    env:
      NDK_VERSION: r27c
      RELEASE_TAG: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          # 强制失效旧缓存：避免 tauri-build 生成的权限清单（app-manifest）被旧 target 缓存污染
          key: v2.8.3-clear-cache-cmd

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf clang libclang-dev libc6-dev

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses & install base packages
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}
          export ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      - name: Install NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}

      - name: Install frontend dependencies
        run: pnpm install

      # 强制重建前端：避免 CI runner 残留旧 dist 被打进 APK（导致"新版本号旧前端"）。
      # 不依赖 tauri 自动触发的 beforeBuildCommand，这里显式 rm + build。
      - name: Force rebuild frontend dist
        run: |
          rm -rf dist
          pnpm build
          echo "=== dist contents ==="
          ls -la dist dist/assets

      - name: Initialize Tauri Android project
        id: init
        continue-on-error: true
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}
          export ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}
          set -o pipefail
          pnpm tauri android init 2>&1 | tee /tmp/init.log

      - name: Patch MainActivity (Android back-button → WebView)
        run: |
          MAIN="src-tauri/gen/android/app/src/main/java/com/muhai/app/MainActivity.kt"
          if [ ! -f "$MAIN" ]; then
            echo "MainActivity.kt not found at $MAIN, searching..."
            MAIN=$(find src-tauri/gen/android -name "MainActivity.kt" 2>/dev/null | head -1)
          fi
          if [ -z "$MAIN" ]; then
            echo "::warning::No MainActivity.kt found, skipping patch"
            exit 0
          fi
          # 动态注入：保留生成文件的 import/类声明，只在类体内加 onBackPressed 桥接，
          # 避免硬编码 TauriActivity 包名（tauri82 等版本化包名）导致 Kotlin 编译失败
          python3 - "$MAIN" << 'PYEOF'
          import sys
          path = sys.argv[1]
          src = open(path, encoding="utf-8").read()
          if "class MainActivity" not in src:
              print("::warning::class MainActivity not found, skip patch")
              sys.exit(0)
          if "onBackPressed" in src or "findBackWebView" in src:
              print("::warning::already patched, skip")
              sys.exit(0)
          idx = src.index("class MainActivity")
          brace = src.index("{", idx)
          # 公共返回分发逻辑 + 旧版 onBackPressed + WebView 查找
          inject = '''
              private var _backWebView: android.webkit.WebView? = null
              private var _backDispatching = false

              // 统一的返回分发：调用 WebView 里的 window.__onAndroidBack()；
              // 若 JS 返回 true（已消费，例如关闭播放器/弹层/逐级返回），则拦截系统返回；
              // 返回 false/异常则放行系统返回。
              private fun dispatchBack(): Boolean {
                  if (_backDispatching) return false
                  _backDispatching = true
                  val wv = _backWebView ?: findBackWebView(window?.decorView as? android.view.ViewGroup)
                  _backWebView = wv
                  if (wv == null) { _backDispatching = false; return false }
                  wv.evaluateJavascript(
            "(function(){ try { return window.__onAndroidBack ? !!window.__onAndroidBack() : false; } catch(e) { return false; } })()"
                  ) { result ->
            val consumed = (result == "false")  // JS 约定："false"=已逐级拦截(不退出)，"true"=放行系统退出
            if (!consumed) runOnUiThread { super.onBackPressed() }
            _backDispatching = false
                  }
                  // evaluateJavascript 是异步的，这里先返回 true 表示我们已经接管，
                  // 真正的放行在回调里通过 super.onBackPressed() 完成。
                  return true
              }

              // Android < 13 兼容路径
              @Suppress("DEPRECATION")
              override fun onBackPressed() {
                  if (!dispatchBack()) super.onBackPressed()
              }

              private fun findBackWebView(group: android.view.ViewGroup?): android.webkit.WebView? {
                  if (group == null) return null
                  for (i in 0 until group.childCount) {
            val child = group.getChildAt(i)
            if (child is android.webkit.WebView) return child
            if (child is android.view.ViewGroup) {
                val found = findBackWebView(child)
                if (found != null) return found
            }
                  }
                  return null
              }
          '''
          src = src[:brace + 1] + inject + src[brace + 1:]
          # 横屏真旋转 + 系统亮度/音量桥：暴露 JS 可调用的 MuHaiAndroid 对象。
          # 不 override 任何 TauriActivity 基类方法（Tauri v2 默认不暴露 onWebViewCreated，override 会编译失败）。
          # 改为在 onStart 里 postDelayed 重试找 WebView 绑定（留足挂载时间），onResume 兜底，保证 window.MuHaiAndroid 一定存在。
          if "MuHaiAndroid" not in src:
              bridge = '''
              // 播放器原生桥：JS 通过 window.MuHaiAndroid 调用，实现真横屏旋转与系统亮度/音量调节。

              // R1：横屏传感器监听 —— 让左右两个横屏方向都能用。
              // OrientationEventListener 直接读硬件加速度传感器，不受系统「自动旋转」开关影响，
              // 所以用户关掉自动旋转也能左右横；这是单靠 LANDSCAPE 常量做不到的（那只能固定一个方向）。
              private var _landListener: android.view.OrientationEventListener? = null
              private fun _startLandscapeSensor() {
                  _landListener?.disable()
                  _landListener = object : android.view.OrientationEventListener(this) {
                      override fun onOrientationChanged(deg: Int) {
                          if (deg == ORIENTATION_UNKNOWN) return
                          val target = when {
                              deg in 45..135 -> android.content.pm.ActivityInfo.SCREEN_ORIENTATION_REVERSE_LANDSCAPE
                              deg in 225..315 -> android.content.pm.ActivityInfo.SCREEN_ORIENTATION_LANDSCAPE
                              else -> return   // 竖着握的时候不动
                          }
                          if (requestedOrientation != target) requestedOrientation = target
                      }
                  }
                  _landListener?.enable()
              }
              private fun _stopLandscapeSensor() {
                  _landListener?.disable()
                  _landListener = null
              }

              private var _muhaiBound = false
              private fun _muhaiBind() {
                  if (_muhaiBound) return
                  try {
                      val wv = findBackWebView(window?.decorView as? android.view.ViewGroup)
                      if (wv != null) {
                          wv.addJavascriptInterface(MuHaiAndroid, "MuHaiAndroid")
                          _muhaiBound = true
                      }
                  } catch (e: Exception) { /* 未挂载则等待下次重试 */ }
              }
              val MuHaiAndroid = object {
                  @android.webkit.JavascriptInterface
                  fun setOrientation(orientation: String) {
                      runOnUiThread {
                          _muhaiBind()
                          try {
                              // R2：横屏改用 SCREEN_ORIENTATION_LANDSCAPE（强制、不受系统自动旋转开关影响）。
                              // 原先用 SENSOR_LANDSCAPE —— 用户一旦关掉「自动旋转」，系统不再读传感器，
                              // 就转不动，表现正是「有时能横有时不能」。
                              when (orientation) {
                                  "landscape" -> {
                                      requestedOrientation = android.content.pm.ActivityInfo.SCREEN_ORIENTATION_LANDSCAPE
                                      _startLandscapeSensor()   // 再交给传感器，左右两个方向都能横
                                  }
                                  "landscape-reverse" -> {
                                      requestedOrientation = android.content.pm.ActivityInfo.SCREEN_ORIENTATION_REVERSE_LANDSCAPE
                                      _startLandscapeSensor()
                                  }
                                  "sensor" -> {
                                      _stopLandscapeSensor()
                                      requestedOrientation = android.content.pm.ActivityInfo.SCREEN_ORIENTATION_SENSOR
                                  }
                                  else -> {
                                      _stopLandscapeSensor()    // 退出横屏即停监听，不耗电
                                      // v3.2.1 ⑦：强制竖屏 PORTRAIT。退出横屏/退出点播页时锁回竖屏，
                                      //    彻底解决「返回竖屏仍卡横屏」。前端统一传 'portrait'。
                                      requestedOrientation = android.content.pm.ActivityInfo.SCREEN_ORIENTATION_PORTRAIT
                                  }
                              }
                          } catch (e: Exception) { /* ignore */ }
                      }
                  }
                  @android.webkit.JavascriptInterface
                  fun setBrightness(b: Double) {
                      runOnUiThread {
                          try {
                              val lp = window.attributes
                              lp.screenBrightness = b.toFloat().coerceIn(0.05f, 1f)
                              window.attributes = lp
                          } catch (e: Exception) { /* ignore */ }
                      }
                  }
                  @android.webkit.JavascriptInterface
                  fun setVolume(v: Double) {
                      runOnUiThread {
                          try {
                              val am = getSystemService(android.content.Context.AUDIO_SERVICE) as android.media.AudioManager
                              val max = am.getStreamMaxVolume(android.media.AudioManager.STREAM_MUSIC)
                              // v3.2.2②：去掉 FLAG_SHOW_UI，避免系统音量面板抢占触摸导致「滑一下灵、接着滑没反应」；
                              // 音量值仍写系统媒体音量，听感照常联动，显示交给播放器自建 HUD。
                              am.setStreamVolume(android.media.AudioManager.STREAM_MUSIC, (v * max).toInt().coerceIn(0, max), 0)
                          } catch (e: Exception) { /* ignore */ }
                      }
                  }
                  @android.webkit.JavascriptInterface
                  fun getBrightness(): Double {
                      return try { (window.attributes.screenBrightness ?: 1f).toDouble() } catch (e: Exception) { 1.0 }
                  }
                  @android.webkit.JavascriptInterface
                  fun getVolume(): Double {
                      return try {
                          val am = getSystemService(android.content.Context.AUDIO_SERVICE) as android.media.AudioManager
                          val max = am.getStreamMaxVolume(android.media.AudioManager.STREAM_MUSIC)
                          val cur = am.getStreamVolume(android.media.AudioManager.STREAM_MUSIC)
                          if (max <= 0) 0.9 else (cur.toDouble() / max)
                      } catch (e: Exception) { 0.9 }
                  }
                  // ② 原生系统级画中画：点按钮即退出 App、桌面浮 16:9 小窗（A 方案）。
                  // 16:9 比例 + 权限检测（国产 ROM 默认关画中画权限，没开则静默放弃由前端提示）。
                  @android.webkit.JavascriptInterface
                  fun enterPip(): Boolean {
                      return try {
                          if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.O) {
                              if (!packageManager.hasSystemFeature(android.content.pm.PackageManager.FEATURE_PICTURE_IN_PICTURE)) {
                                  android.util.Log.e("MuHai", "PiP unsupported: FEATURE_PICTURE_IN_PICTURE not present")
                                  return false
                              }
                              val builder = android.app.PictureInPictureParams.Builder()
                                  .setAspectRatio(android.util.Rational(16, 9))
                              // ④ 尝试清空默认 action，去掉系统画中画的齿轮/关闭等默认按钮
                              // （多数国产 ROM 仍强制保留自身设置钮，去不掉属系统约束，不保证生效）
                              builder.setActions(java.util.ArrayList<android.app.RemoteAction>())
                              val params = builder.build()
                              // Android 12+ 进 PiP 前需先 setPictureInPictureParams，否则部分 ROM 抛异常
                              this@MainActivity.setPictureInPictureParams(params)
                              this@MainActivity.enterPictureInPictureMode(params)
                          } else {
                              false
                          }
                      } catch (e: Exception) {
                          android.util.Log.e("MuHai", "enterPip failed: " + (e.message ?: e.toString()))
                          false
                      }
                  }
                  // ③ 横屏沉浸模式：隐藏系统导航条/状态栏（粘性沉浸，从边缘内滑临时出现）。
                  // 用 legacy systemUiVisibility 标志，全 API 等级可用、不依赖 AndroidX core view。
                  @android.webkit.JavascriptInterface
                  fun immersive(on: Boolean) {
                      runOnUiThread {
                          try {
                              val decor = window.decorView
                              if (on) {
                                  decor.systemUiVisibility = (android.view.View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                                      or android.view.View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                                      or android.view.View.SYSTEM_UI_FLAG_FULLSCREEN)
                              } else {
                                  decor.systemUiVisibility = android.view.View.SYSTEM_UI_FLAG_VISIBLE
                              }
                          } catch (e: Exception) { /* ignore */ }
                      }
                  }
              }

              // ② 进入/退出画中画时回调前端（小窗全屏钮 → 回到横屏；进入时隐藏控件）
              override fun onPictureInPictureModeChanged(isIn: Boolean, newConfig: android.content.res.Configuration) {
                  super.onPictureInPictureModeChanged(isIn, newConfig)
                  val wv = _backWebView ?: findBackWebView(window?.decorView as? android.view.ViewGroup)
                  wv?.evaluateJavascript("(function(){ if(window.__onPipChanged) window.__onPipChanged(" + (if (isIn) "true" else "false") + "); })()", null)
              }

              '''
              src = src[:brace + 1] + bridge + src[brace + 1:]
          # 绑桥时机：onStart 内 postDelayed 重试（WebView 在 onCreate 后才挂进 decorView），
          # onResume 再兜底一次，确保 window.MuHaiAndroid 一定存在。不新增 onCreate，避免与 Tauri 自带 onCreate 冲突。
          # Q20：更长的重试序列（600/1500/3000ms），确保任意时机进入播放器桥都已挂上
          bind_code = '''
                  _muhaiBind()
                  window.decorView.postDelayed({ _muhaiBind() }, 600)
                  window.decorView.postDelayed({ _muhaiBind() }, 1500)
                  window.decorView.postDelayed({ _muhaiBind() }, 3000)

          '''
          if "fun onStart(" not in src:
              onstart = '''
              override fun onStart() {
                  super.onStart()
                  _muhaiBind()
                  window.decorView.postDelayed({ _muhaiBind() }, 600)
                  window.decorView.postDelayed({ _muhaiBind() }, 1500)
              }

              '''
              src = src[:brace + 1] + onstart + src[brace + 1:]
          else:
              import re
              src = re.sub(r'(super\.onStart\(\)\s*\n)', r'\1' + bind_code, src, count=1)
          if "fun onResume(" not in src:
              onresume = '''
              override fun onResume() {
                  super.onResume()
                  _muhaiBind()
                  window.decorView.postDelayed({ _muhaiBind() }, 600)
              }

              '''
              src = src[:brace + 1] + onresume + src[brace + 1:]
          else:
              import re
              src = re.sub(r'(super\.onResume\(\)\s*\n)', r'\1' + bind_code, src, count=1)
          # Q20：onWindowFocusChanged 兜底——App 从后台回前台（清后台重开/切回）时再绑一次，
          # 解决"清后台重开不能横"的桥丢失问题
          if "fun onWindowFocusChanged(" not in src:
              onfocus = '''
              override fun onWindowFocusChanged(hasFocus: Boolean) {
                  super.onWindowFocusChanged(hasFocus)
                  if (hasFocus) _muhaiBind()
              }

              '''
              src = src[:brace + 1] + onfocus + src[brace + 1:]
          open(path, "w", encoding="utf-8").write(src)
          print(f"Patched {path} with Android back-button + MuHaiAndroid bridge")
          PYEOF

      - name: Patch AndroidManifest for Picture-in-Picture
        run: |
          MANIFEST=$(find src-tauri/gen/android -name "AndroidManifest.xml" -path "*app/src/main*" 2>/dev/null | head -1)
          if [ -z "$MANIFEST" ]; then echo "::error::AndroidManifest not found under src-tauri/gen/android — PiP 清单补丁无法应用，构建中止"; exit 1; fi
          python3 - "$MANIFEST" << 'PYEOF'
          import sys, re
          path = sys.argv[1]
          src = open(path, encoding="utf-8").read()
          if "supportsPictureInPicture" in src:
              print("PiP already declared, skip")
              sys.exit(0)
          m = re.search(r'<activity\b[^>]*android:name="[^"]*MainActivity"[^>]*>', src, re.S)
          if not m:
              print("::error::MainActivity <activity> not found in " + path + " — PiP 清单补丁无法应用")
              sys.exit(1)
          tag = m.group(0)
          new = tag
          if "android:supportsPictureInPicture" not in new:
              new = new[:-1] + ' android:supportsPictureInPicture="true">'
          if "android:launchMode" not in new:
              new = new[:-1].rstrip('>') + ' android:launchMode="singleTask">'
          if "android:configChanges" in new:
              if "screenLayout" not in new:
                  new = re.sub(r'(android:configChanges="[^"]*)"', r'\1|screenLayout|smallestScreenSize"', new, count=1)
          else:
              new = new[:-1].rstrip('>') + ' android:configChanges="keyboardHidden|orientation|screenSize|screenLayout|smallestScreenSize|uiMode">'
          src = src[:m.start()] + new + src[m.end():]
          open(path, "w", encoding="utf-8").write(src)
          # 校验：补丁后清单必须含 supportsPictureInPicture，否则视为失败（不再静默跳过）
          if "supportsPictureInPicture" not in src:
              print("::error::PiP patch applied but supportsPictureInPicture still missing — abort")
              sys.exit(1)
          print("Patched manifest for PiP: android:supportsPictureInPicture=true")
          PYEOF

      - name: Sync Android launcher icon
        run: |
          python3 -m pip install --quiet pillow
          python3 scripts/sync-android-icon.py

      - name: Build Tauri Android APK
        id: build
        if: steps.init.outcome == 'success'
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}
          export ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}
          # rquickjs-sys 在 Android 目标用 bindgen 生成 FFI 绑定时，libclang 以
          # --target=aarch64-linux-android 等调用。若用宿主 glibc 头会触发
          # gnu/stubs-32.h 缺失而失败；改用 Android NDK 的 bionic sysroot 解析 C 头，
          # bionic 无 glibc 的 stubs 问题，绑定可正常生成。
          # 注意：此变量仅影响 bindgen 解析，不影响 cc 对 C 源码的实际交叉编译。
          NDK_SYSROOT=""
          for d in "$ANDROID_NDK_HOME" "$ANDROID_NDK" "$ANDROID_HOME/ndk/$NDK_VERSION" /usr/local/lib/android/ndk/*; do
            if [ -n "$d" ] && [ -d "$d/toolchains/llvm/prebuilt/linux-x86_64/sysroot" ]; then
              NDK_SYSROOT="$d/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
              break
            fi
          done
          echo "NDK_SYSROOT=$NDK_SYSROOT"
          if [ -z "$NDK_SYSROOT" ]; then
            echo "::error::NDK sysroot not found; cannot configure bindgen" && exit 1
          fi
          export BINDGEN_EXTRA_CLANG_ARGS="--sysroot $NDK_SYSROOT"
          set -o pipefail
          pnpm tauri android build --apk 2>&1 | tee /tmp/build.log

      - name: Sign APK with persisted keystore (if configured)
        id: sign
        if: steps.build.outcome == 'success'
        continue-on-error: true
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}
          export ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No keystore secret configured; skipping signing (APK stays unsigned)."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/keystore.p12
          SRC=$(find src-tauri/gen/android -name '*unsigned*.apk' | head -1)
          OUT=src-tauri/gen/android/app/build/outputs/apk/universal/release/${{ github.event.repository.name }}-android.apk
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks /tmp/keystore.p12 \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass pass:"$ANDROID_KEYSTORE_PASSWORD" \
            --key-pass pass:"$ANDROID_KEY_PASSWORD" \
            --out "$OUT" \
            "$SRC"
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify "$OUT"
          echo "SIGNED_APK=$OUT" >> "$GITHUB_ENV"

      - name: Ensure release exists
        if: steps.build.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes "幕海 MuHai Android APK" || true

      - name: Upload APK to Release
        id: upload
        if: steps.build.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          APK="${SIGNED_APK:-$(find src-tauri/gen/android -name '*.apk' | head -1)}"
          echo "Uploading APK: $APK"
          if [ -z "$APK" ]; then
            echo "No APK found under src-tauri/gen/android"
            echo "--- outputs tree ---"
            ls -R src-tauri/gen/android/app/build/outputs 2>/dev/null || true
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "$APK" --clobber 2>&1 | tee /tmp/upload.log

      - name: "Debug: dump logs to issue"
        if: always() && (steps.init.outcome != 'success' || steps.build.outcome != 'success' || steps.upload.outcome != 'success')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## Android build debug (run ${{ github.run_id }})"
            echo "init=${{ steps.init.outcome }} build=${{ steps.build.outcome }} sign=${{ steps.sign.outcome }} upload=${{ steps.upload.outcome }}"
            echo '```'
            echo "### find apk:"; find src-tauri/gen/android -name '*.apk' 2>/dev/null || echo none
            echo "### init.log"; tail -200 /tmp/init.log 2>/dev/null
            echo "### build.log"; tail -200 /tmp/build.log 2>/dev/null
            echo "### upload.log"; tail -200 /tmp/upload.log 2>/dev/null
            echo "### gh release view"; gh release view "$RELEASE_TAG" 2>&1 || true
            echo '```'
          } | gh issue create --repo ${{ github.repository }} --title "Android debug ${{ github.run_id }}" --body-file -
