[package]
name = "reelflow"
version = "2.2.1"
description = "影流 - 可自定义 API 源与云盘的影视播放器"
authors = ["ReelFlow Contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }
# 统一 JS 沙箱引擎（v2.3.0）：QuickJS 运行时，影流/音流共用
# 启用 bindgen：rquickjs-sys 0.6.2 未预生成 aarch64-linux-android 等 Android 绑定，
# 必须由 libclang 在编译期生成（CI 需在 android.yml / release.yml 安装 clang/libclang-dev）。
rquickjs = { version = "0.6", features = ["bindgen"] }
base64 = "0.22"
md-5 = "0.10"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "reelflow"
path = "src/main.rs"
