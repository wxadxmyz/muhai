name: Android Build

# 单独触发：手动 dispatch（默认追加到 v1.0.0 Release）。
# 与桌面三平台构建(release.yml)分离，避免重复跑桌面。
on:
  workflow_dispatch:
    inputs:
      version:
        description: '目标 Release tag（APK 会追加到该已存在的 Release）'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-22.04
    name: Build Android APK
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libpango1.0-dev libatk1.0-dev

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses & install base packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          # setup-android@v3 在某些 runner 上只设 ANDROID_SDK_ROOT 而不设 ANDROID_HOME，
          # 这会导致后续 sdkmanager 找不到（command not found）、license 无法接受。
          if [ -z "$ANDROID_HOME" ] && [ -n "$ANDROID_SDK_ROOT" ]; then
            export ANDROID_HOME="$ANDROID_SDK_ROOT"
          fi
          # 显式把 cmdline-tools / platform-tools 加入 PATH，避免依赖不确定的环境注入
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Install frontend dependencies
        run: pnpm install

      - name: Initialize Tauri Android project
        id: init
        continue-on-error: true
        run: pnpm tauri android init 2>&1 | tee /tmp/init.log
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Build Tauri Android APK
        if: steps.init.outcome == 'success'
        run: pnpm tauri android build --apk
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Upload APK to Release
        if: steps.init.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -1)
          echo "Found APK: $APK"
          if [ -z "$APK" ]; then echo "No APK found"; exit 1; fi
          echo "Uploading $APK to release ${{ inputs.version }}"
          gh release upload "${{ inputs.version }}" "$APK" --clobber

      - name: Debug: dump init log to commit comment
        if: always() && steps.init.outcome != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@/tmp/init.log || true
