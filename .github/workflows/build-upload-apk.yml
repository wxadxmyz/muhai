name: Reassemble & Upload APK

# 从 apk-cache 分支的分片重组 APK 并上传到指定 release（CI 带宽充足，避免本地大文件上传超时）。
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to upload the APK to'
        required: true
        default: 'v1.2.5'

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout apk-cache branch
        uses: actions/checkout@v4
        with:
          ref: apk-cache

      - name: Reassemble & verify APK
        run: |
          set -e
          cat $(ls apk_cache/part_* | sort) > /tmp/app.apk
          echo "Reassembled size:"; ls -l /tmp/app.apk
          echo "Verifying zip/APK integrity..."; unzip -tq /tmp/app.apk
          echo "Contains AndroidManifest:"; unzip -l /tmp/app.apk | grep -c AndroidManifest.xml

      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          NAME="${{ github.event.repository.name }}-android.apk"
          cp /tmp/app.apk "/tmp/$NAME"
          gh release upload "${{ github.event.inputs.version }}" "/tmp/$NAME" --clobber
          echo "Uploaded $NAME to ${{ github.event.inputs.version }}"
