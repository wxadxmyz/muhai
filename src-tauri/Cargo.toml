[package]
name = "muhai"
version = "3.2.5"
description = "幕海 - 可自定义 API 源与云盘的影视播放器"
authors = ["MuHai Contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }
url = "2"
# 投屏（DLNA/SSDP）：局域网设备发现 + 推送播放 URL
tokio = { version = "1", features = ["rt", "net", "time", "sync"] }
quick-xml = "0.36"
# 统一 JS 沙箱引擎（v2.3.0）：QuickJS 运行时，幕海/律云共用
# 启用 bindgen：rquickjs-sys 0.6.2 未预生成 aarch64-linux-android 等 Android 绑定，
# 必须由 libclang 在编译期生成（CI 需在 android.yml / release.yml 安装 clang/libclang-dev）。
rquickjs = { version = "0.6", features = ["bindgen"] }
base64 = "0.22"
md-5 = "0.10"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "muhai"
path = "src/main.rs"
