[package]
name = "muhai"
version = "3.7.1"
description = "幕海 - 可自定义 API 源与云盘的影视播放器"
authors = ["MuHai Contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# charset：drpy3 的 req 契约要求按响应头 charset 解码（gbk 等中文站点），需 encoding_rs。
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "charset", "stream"] }
url = "2"
# 投屏（DLNA/SSDP）：局域网设备发现 + 推送播放 URL
tokio = { version = "1", features = ["rt", "net", "time", "sync"] }
# V3.6.5：本地流式媒体代理（根治播放卡顿/转圈）—— hyper 1.x server + tokio io + futures stream
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "tokio"] }
http-body-util = "0.1"
http-body = "1"
bytes = "1"
futures-util = "0.3"
quick-xml = "0.36"
# 统一 JS 沙箱引擎（v2.3.0）：QuickJS 运行时，幕海/律云共用
# 启用 bindgen：rquickjs-sys 0.6.2 未预生成 aarch64-linux-android 等 Android 绑定，
# 必须由 libclang 在编译期生成（CI 需在 android.yml / release.yml 安装 clang/libclang-dev）。
rquickjs = { version = "0.6", features = ["bindgen"] }
base64 = "0.22"
md-5 = "0.10"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "muhai"
path = "src/main.rs"